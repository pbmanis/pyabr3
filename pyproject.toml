[project]
name = "pyabr3"
dynamic = ["version"]  # from __version__ in src/__init__.py
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # development utilities and general tools
    "black>=24.8",
    "Pint>=0.24",
    "isort>=5.13.2",
    "mypy>=1.13",
    "pytest>=8.4.1",
    # Specific requirements
    "nidaqmx",
    "tdtpy; sys_platform == 'win32'",
    "matplotlib>=3.10.1",
    "pandas",
    "seaborn",
    "numpy<2.3.0",
    # "numba", 
    "openpyxl>=3.1.2",
    "psutil>=6.1.0",
    "pyparsing>=3.2.3",
    "resampy==0.4.3",
    "scipy>=1.15.0",
    "scikit-learn>=1.4.2",
    "kneed",
    "lmfit",
    "pyaudio",  # this might have to be done manually
    "sounddevice>=0.5.2",
    # get pyaudio win-amd64.whl file from https://www.lfd.uci.edu/~gohlke/pythonlibs/
    # make a downloads file in pysounds, and put it in the downloads directory
    # 11/2024: Gohlke's site is permanently down. 
    # 11/2024: It looks like a precompiled windows version is available for python3.13 on PyPI.
    # so, this should work.
    "pyqt6>=6.7",
    "pyqt6-sip>=13.8",
    "pyqtgraph>=0.13.7",
    "pylibrary @ git+https://github.com/pbmanis/pylibrary.git@main"
]

[dependency-groups]
build = ["pyinstaller>=6.0"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm.version]
source = "file"
path = "src/__init__.py"

[tool.pytest.ini_options]
minversion = "8.0"
# --confcutdir: the __init__.py in the directory above this repository cannot be imported
addopts = "-ra -q --confcutdir=tests"
# the other files in tests/ are scripts that drive the audio and DAQ hardware
testpaths = [
    "tests/test_calibration.py",
    "tests/test_viewer.py",
    ]


